name: sample sources
# One-off: fetch the sources for the caption samples (a vertical short and a
# clip of a horizontal episode), transcribe the clip, commit them back here.
on:
  push:
    branches: [sample-job]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[results]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper==1.1.1
      - name: Fetch and transcribe
        run: |
          mkdir -p results
          set -o pipefail
          python3 -u job/transcribe_clip.py 2>&1 | tee results/log.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "sample-bot"
          git config user.email "sample-bot@users.noreply.github.com"
          git add results || true
          git commit -m "[results] caption sample sources" || exit 0
          git push origin HEAD:sample-job
